# A tag vX.Y.Z builds the cribelo binary for every platform and attaches it to
# the release of the same name. install.sh and action.yml download from there.
# A version with a dash (v1.0.0-rc.1) is published as a pre-release, which
# releases/latest ignores.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cribelo_Linux_x86_64
          - os: ubuntu-24.04-arm
            asset: cribelo_Linux_arm64
          - os: macos-15-intel
            asset: cribelo_Darwin_x86_64
          - os: macos-15
            asset: cribelo_Darwin_arm64
          - os: windows-latest
            asset: cribelo_Windows_x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Toolchain (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Toolchain (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "out/$ASSET" .
          "./out/$ASSET" --version

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          flags=()
          case "$tag" in *-*) flags+=(--prerelease) ;; esac
          # Five jobs race to create the release; the losers fall through to the upload.
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes ${flags[@]+"${flags[@]}"} \
            || true
          gh release upload "$tag" --clobber "out/$ASSET"

  # Moves the major tag (v1) to this release, so that `uses: cribelo/cribelo@v1`
  # gets it. Skipped for pre-releases, and for a patch on an older line: v1
  # stays on the newest v1.x.y.
  major-tag:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Move the major tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          major="${tag%%.*}"
          git fetch --tags --force
          newest=$(git tag -l "$major.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ "$newest" != "$tag" ]; then
            echo "$tag is not the newest $major release, $newest is: $major stays where it is"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$major" -m "$major" "$tag^{commit}"
          git push -f origin "refs/tags/$major"
          echo "$major now points at $tag ($(git rev-parse --short "$tag^{commit}"))"

  # Rewrites Formula/cribelo.rb in cribelo/homebrew-tap so that
  # `brew install cribelo/tap/cribelo` gets this version. Pre-releases are skipped.
  # Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained token with
  # contents: write on cribelo/homebrew-tap.
  homebrew:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" -D assets -p 'cribelo_Darwin_*' -p 'cribelo_Linux_*'
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" assets > cribelo.rb

      - name: Push to the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/cribelo/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp cribelo.rb tap/Formula/cribelo.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Formula/cribelo.rb
          git diff --cached --quiet && exit 0
          git commit -m "cribelo ${GITHUB_REF_NAME#v}"
          git push
